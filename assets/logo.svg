<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200" role="img" aria-label="android-cmux — the cmux client for Android">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E141B"/>
      <stop offset="100%" stop-color="#1D2A36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>

  <rect width="640" height="200" rx="28" fill="url(#bg)"/>

  <!-- 手机轮廓：android-cmux 是 cmux 的手机端 -->
  <rect x="52" y="34" width="100" height="132" rx="22" fill="none" stroke="url(#accent)" stroke-width="5"/>
  <!-- 听筒 -->
  <rect x="88" y="44" width="28" height="4" rx="2" fill="#4ADE80" opacity="0.55"/>
  <!-- 终端提示符 > -->
  <path d="M80 92 L98 104 L80 116" fill="none" stroke="#E8F5EE" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 光标 -->
  <path d="M106 116 L124 116" fill="none" stroke="#4ADE80" stroke-width="6" stroke-linecap="round"/>

  <!-- 名称 -->
  <text x="190" y="96" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="600" fill="#F5F7FA" letter-spacing="-0.5">android-cmux</text>
  <!-- 定位 -->
  <text x="192" y="130" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8FA3B0" letter-spacing="0.3">The cmux client for Android</text>
</svg>
